name: Update Work Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds (not ~16 min of retries) if the PAT has expired or been revoked.
      - name: Verify work token is valid
        env:
          WORK_TOKEN: ${{ secrets.WORK_TOKEN }}
        run: |
          check() {
            login=$(curl -sS -H "Authorization: Bearer $2" https://api.github.com/user | jq -r '.login // empty')
            if [ -z "$login" ]; then
              echo "::error::$1 is invalid or expired. Regenerate the PAT and update the repo secret."
              exit 1
            fi
            echo "$1 OK (authenticated as $login)"
          }
          check WORK_TOKEN "$WORK_TOKEN"

      - name: Generate Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.WORK_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: harshramani-verveware
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Chicago
